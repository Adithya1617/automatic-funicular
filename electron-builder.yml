appId: com.hyprride.inventory
productName: Hyprride Inventory
copyright: Copyright (c) 2026 Hyprride Bike Rentals
asar: true
directories:
  output: dist
files:
  - out/**
  - package.json
extraResources:
  # Drizzle migrations must travel with the installer; the main process reads
  # them from process.resourcesPath/db/migrations in production
  # (main/index.ts bootstrap()).
  - from: main/db/migrations
    to: db/migrations
    filter:
      - "**/*"
asarUnpack:
  # better-sqlite3 ships a native .node — must NOT live inside an asar.
  - "**/node_modules/better-sqlite3/**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Hyprride Inventory
publish: null
